name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build watch app
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          cp Local.xcconfig.example Local.xcconfig
          xcodegen generate

      # A generic destination avoids naming a concrete simulator — the runner
      # image doesn't carry the same device catalog as a local Xcode install,
      # and this job only builds, it never launches.
      - name: Build (unsigned)
        run: |
          xcodebuild \
            -scheme FocusAppWatch \
            -configuration Debug \
            -destination "generic/platform=watchOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
