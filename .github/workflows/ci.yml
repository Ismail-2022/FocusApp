name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (Demo, unsigned)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          cp Local.xcconfig.example Local.xcconfig
          xcodegen generate

      # Generic destinations deliberately avoid naming a concrete simulator —
      # GitHub's runner image doesn't guarantee the same device catalog as a
      # developer's machine, and this job only builds, it never launches.
      # (Local `make demo` uses a named, booted simulator since it does launch.)
      - name: Build iOS app (Demo Mode, no signing)
        run: |
          xcodebuild \
            -scheme "FocusApp (Demo)" \
            -configuration Demo \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build watchOS app (unsigned)
        run: |
          xcodebuild \
            -scheme FocusAppWatch \
            -configuration Demo \
            -destination "generic/platform=watchOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
