name: FocusApp

options:
  bundleIdPrefix: com.ismail
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:

  FocusAppWatch:
    type: application
    platform: watchOS
    sources:
      - Shared
      - FocusAppWatch
    info:
      path: FocusAppWatch/Info.plist
      properties:
        CFBundleDisplayName: FocusApp
        WKApplication: true
        # Standalone watch app — there is no iPhone companion.
        WKWatchOnly: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ismail.focusapp.watchkitapp
